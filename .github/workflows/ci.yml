name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Use the runner's existing Chrome helper for sandboxed bundled Chromium.
      # No AppArmor policy or kernel settings are changed.
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-credentials.txt
      - run: python -m pip install --no-deps .
      - run: python -m playwright install --with-deps chromium
      - name: Check Chromium sandbox before using synthetic credentials
        run: |
          python - <<'PY'
          import os, stat
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          helper = Path(os.environ['CHROME_DEVEL_SANDBOX'])
          info = helper.stat()
          assert info.st_uid == 0 and info.st_mode & stat.S_ISUID and not info.st_mode & 0o022
          for parent in helper.parents:
              info = parent.stat()
              assert info.st_uid == 0 and not info.st_mode & 0o022
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True, chromium_sandbox=True)
              browser.close()
          PY
      - run: python -m unittest discover -s tests -v
      - run: python -m pip check
